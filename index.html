<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messy Text Cleaner</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --focus-ring: rgba(37, 99, 235, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.4rem;
      font-weight: 650;
    }

    p.subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px 14px;
      font: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text);
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: vertical;
      transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
    }

    textarea:focus {
      outline: none;
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: #f3f4f6;
    }

    .status {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .output-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
    }

    .output-section[hidden] {
      display: none;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .output-header label {
      margin-bottom: 0;
    }

    pre {
      margin: 0;
      padding: 12px 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Messy Text Cleaner</h1>
    <p class="subtitle">Paste unstructured or messy text below and click the button to clean it up locally.</p>

    <label for="messyInput">Messy text</label>
    <textarea
      id="messyInput"
      placeholder="Paste your messy text here..."
    ></textarea>

    <div class="actions">
      <button id="processBtn" class="btn-primary" type="button">Clean Text</button>
      <span id="statusText" class="status" aria-live="polite"></span>
    </div>

    <section id="outputSection" class="output-section" hidden>
      <div class="output-header">
        <label for="cleanOutput">Result</label>
        <button id="copyBtn" class="btn-secondary" type="button">Copy</button>
      </div>
      <pre id="cleanOutput"></pre>
    </section>
  </main>

  <script>
    const messyInput = document.getElementById("messyInput");
    const processBtn = document.getElementById("processBtn");
    const outputSection = document.getElementById("outputSection");
    const cleanOutput = document.getElementById("cleanOutput");
    const copyBtn = document.getElementById("copyBtn");
    const statusText = document.getElementById("statusText");

    // Local cleanup logic (can later be swapped for a backend/API call without storing keys in HTML).
    function cleanText(rawText) {
      return rawText
        .replace(/\r\n?/g, "\n")
        .split("\n")
        .map((line) => line.replace(/[ \t]+/g, " ").trim())
        .join("\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    processBtn.addEventListener("click", () => {
      const input = messyInput.value;

      if (!input.trim()) {
        outputSection.hidden = true;
        cleanOutput.textContent = "";
        statusText.textContent = "Please paste some text first.";
        messyInput.focus();
        return;
      }

      const result = cleanText(input);
      cleanOutput.textContent = result;
      outputSection.hidden = false;
      statusText.textContent = `${result.length} characters`;
      copyBtn.textContent = "Copy";
    });

    copyBtn.addEventListener("click", async () => {
      const text = cleanOutput.textContent;
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = "Copied!";
        setTimeout(() => {
          copyBtn.textContent = "Copy";
        }, 1500);
      } catch {
        statusText.textContent = "Could not access clipboard.";
      }
    });
  </script>
</body>
</html>
