<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messy Text Organizer</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-subtle: #f9fafb;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --input-border: #d1d5db;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --focus-ring: rgba(37, 99, 235, 0.18);
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 36px 20px 56px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 4px 18px rgba(17, 24, 39, 0.04);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      padding: 12px 14px;
      font: inherit;
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text);
      background: var(--surface-subtle);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      resize: vertical;
      transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
    }

    textarea:focus {
      outline: none;
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, opacity 0.15s;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--input-border);
      padding: 7px 12px;
      font-size: 0.85rem;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f3f4f6;
    }

    .hint {
      margin-left: auto;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .error-banner {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 9px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      font-size: 0.9rem;
    }

    .error-banner[hidden],
    .results-card[hidden],
    .json-box[hidden] {
      display: none;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .results-header h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
    }

    .results-tools {
      display: flex;
      gap: 8px;
    }

    .section {
      padding: 16px;
      border-radius: 10px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
    }

    .section + .section {
      margin-top: 14px;
    }

    .section-summary {
      background: var(--accent-soft);
      border-color: #dbeafe;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-summary .section-title {
      color: #1d4ed8;
    }

    .summary-text {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.55;
    }

    ul.clean-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .empty-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      font-style: italic;
    }

    .json-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #111827;
      color: #f9fafb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.84rem;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Messy Text Organizer</h1>
      <p class="subtitle">
        Paste messy notes, emails, or transcripts below to get a structured summary, key points, and action items.
      </p>

      <label for="messyInput">Messy text</label>
      <textarea
        id="messyInput"
        placeholder="Paste your messy text here..."
      ></textarea>

      <div class="actions">
        <button id="processBtn" class="btn-primary" type="button">Organize Text</button>
        <span id="statusText" class="hint" aria-live="polite">Ctrl + Enter to submit</span>
      </div>

      <div id="errorBanner" class="error-banner" role="alert" hidden></div>
    </section>

    <section id="resultsCard" class="card results-card" hidden>
      <div class="results-header">
        <h2>Structured Output</h2>
        <div class="results-tools">
          <button id="toggleJsonBtn" class="btn-secondary" type="button">View JSON</button>
          <button id="copyJsonBtn" class="btn-secondary" type="button">Copy JSON</button>
        </div>
      </div>

      <div class="section section-summary">
        <h3 class="section-title">Summary</h3>
        <p id="summaryText" class="summary-text"></p>
      </div>

      <div class="section">
        <h3 class="section-title">Key Points</h3>
        <ul id="keyPointsList" class="clean-list"></ul>
        <p id="keyPointsEmpty" class="empty-note" hidden>No key points identified.</p>
      </div>

      <div class="section">
        <h3 class="section-title">Action Items</h3>
        <ul id="actionItemsList" class="clean-list"></ul>
        <p id="actionItemsEmpty" class="empty-note" hidden>No action items found.</p>
      </div>

      <pre id="rawJsonBox" class="json-box" hidden></pre>
    </section>
  </main>

  <script>
    const messyInput = document.getElementById("messyInput");
    const processBtn = document.getElementById("processBtn");
    const statusText = document.getElementById("statusText");
    const errorBanner = document.getElementById("errorBanner");
    const resultsCard = document.getElementById("resultsCard");
    const summaryText = document.getElementById("summaryText");
    const keyPointsList = document.getElementById("keyPointsList");
    const keyPointsEmpty = document.getElementById("keyPointsEmpty");
    const actionItemsList = document.getElementById("actionItemsList");
    const actionItemsEmpty = document.getElementById("actionItemsEmpty");
    const toggleJsonBtn = document.getElementById("toggleJsonBtn");
    const copyJsonBtn = document.getElementById("copyJsonBtn");
    const rawJsonBox = document.getElementById("rawJsonBox");

    let lastResult = null;

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.hidden = false;
    }

    function clearError() {
      errorBanner.textContent = "";
      errorBanner.hidden = true;
    }

    function renderList(listEl, emptyEl, items) {
      listEl.replaceChildren();
      if (!Array.isArray(items) || items.length === 0) {
        emptyEl.hidden = false;
        return;
      }
      emptyEl.hidden = true;
      for (const item of items) {
        const li = document.createElement("li");
        li.textContent = item;
        listEl.appendChild(li);
      }
    }

    function renderResults(data) {
      lastResult = data;
      summaryText.textContent = data.summary || "";
      renderList(keyPointsList, keyPointsEmpty, data.key_points);
      renderList(actionItemsList, actionItemsEmpty, data.action_items);
      rawJsonBox.textContent = JSON.stringify(data, null, 2);
      resultsCard.hidden = false;
    }

    async function organizeText() {
      const text = messyInput.value.trim();
      clearError();

      if (!text) {
        showError("Please paste some text before clicking Organize Text.");
        messyInput.focus();
        return;
      }

      processBtn.disabled = true;
      processBtn.textContent = "Organizing...";
      statusText.textContent = "Calling Gemini...";

      try {
        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(payload.error || `Request failed (${response.status}).`);
        }

        renderResults(payload);
        statusText.textContent = "Done";
      } catch (err) {
        showError(err.message || "Something went wrong while analyzing your text.");
        statusText.textContent = "Ctrl + Enter to submit";
      } finally {
        processBtn.disabled = false;
        processBtn.textContent = "Organize Text";
      }
    }

    processBtn.addEventListener("click", organizeText);

    messyInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        organizeText();
      }
    });

    toggleJsonBtn.addEventListener("click", () => {
      const willShow = rawJsonBox.hidden;
      rawJsonBox.hidden = !willShow;
      toggleJsonBtn.textContent = willShow ? "Hide JSON" : "View JSON";
    });

    copyJsonBtn.addEventListener("click", async () => {
      if (!lastResult) return;
      try {
        await navigator.clipboard.writeText(JSON.stringify(lastResult, null, 2));
        copyJsonBtn.textContent = "Copied!";
        setTimeout(() => {
          copyJsonBtn.textContent = "Copy JSON";
        }, 1500);
      } catch {
        showError("Could not copy JSON to clipboard.");
      }
    });
  </script>
</body>
</html>
